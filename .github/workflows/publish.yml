name: Publish

on:
  push:
    branches:
      - 'main'
    # workflow-only changes don't need a release
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume a failed publish (lerna from-package, no version bump)'
        type: boolean
        default: false

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: "0"
          token: ${{ secrets.MACHINE_PAT }}

      - name: Set Github credentials
        run: |
          git config user.name searchspring-machine
          git config user.email machine@searchspring.com

      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install packages
        run: npm ci

      # lerna gives Rekor 5s then retries - the retry 409s on the entry the first attempt created
      # fetch that entry instead of failing (npm/cli#10078) - the grep fails the job if sigstore changes this line
      - name: Recover from duplicate Rekor entries
        run: |
          f=node_modules/sigstore/dist/config.js
          grep -q 'fetchOnConflict: false' "$f"
          sed -i 's/fetchOnConflict: false/fetchOnConflict: true/' "$f"

      - name: Build
        run: | 
          npm run build

      - name: Tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run test

      - name: Publish packages
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resume failed publish (from-package)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.resume == 'true' && github.ref_name == 'main'
        # --ignore-scripts: without it lerna runs the root `publish` script afterwards - a full versioned publish
        run: npx lerna publish from-package --yes --no-verify-access --ignore-scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.SNAPFU_AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SNAPFU_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Generate Metrics Files
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: npm run build:metrics

      - name: Upload Metrics Files to S3
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: aws s3 sync --region us-east-1 ./metrics/data s3://datawarehouse-stage/team-metrics-import/